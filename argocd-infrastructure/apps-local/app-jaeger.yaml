apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://jaegertracing.github.io/helm-charts'
    chart: jaeger
    targetRevision: '4.13.1'
    helm:
      values: |
        provisionDataStore:
          cassandra: false
        allInOne:
          enabled: true
          service:
            collector:
              otlp:
                grpc:
                  name: otlp-grpc
                  port: 4317
                http:
                  name: otlp-http
                  port: 4318
        collector:
          enabled: false
        query:
          enabled: false
        agent:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: finflow-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true