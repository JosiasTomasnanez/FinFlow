apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelcol-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
    chart: opentelemetry-collector
    targetRevision: '0.173.1'
    helm:
      values: |
        mode: deployment
        image:
          repository: otel/opentelemetry-collector-contrib

        config:
          receivers:
            jaeger: null
            zipkin: null
            prometheus: null
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
                  cors:
                    allowed_origins:
                      - "http://prod.finflow.local"
                      - "http://staging.finflow.local"
                grpc: null
          exporters:
            debug:
              verbosity: detailed
            otlp/jaeger:
              endpoint: jaeger.finflow-infra.svc.cluster.local:4317
              tls:
                insecure: true
            otlphttp/loki:
              endpoint: http://loki.finflow-infra.svc.cluster.local:3100/otlp
              tls:
                insecure: true
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlp/jaeger, debug]
              metrics: null
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlphttp/loki]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: finflow-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
