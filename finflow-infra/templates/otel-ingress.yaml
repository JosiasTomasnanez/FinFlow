{{- if and .Values.ingress .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-otel-ingress
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range list "staging.finflow.local" "prod.finflow.local" }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.paths.backendService }}
                port:
                  number: 4318
          - path: /v1/logs
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.paths.backendService }}
                port:
                  number: 4318
      {{- end }}
{{- end }}
