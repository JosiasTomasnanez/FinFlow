enabled: true

unleash:
  db:
    storageSize: 3Gi

prometheus:
  monitoredNamespaces:
    - finflow-staging
    - finflow-prod

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.57"
  storageSize: 5Gi
  storageClass: ""

ingress:
  enabled: true
  className: "traefik"
  hosts:
    unleash: "unleash.finflow.local"
    grafana: "grafana.finflow.local"
    jaeger: "jaeger.finflow.local"
    argocd: "argocd.finflow.local"

otelIngress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "4242"
  hosts:
    - "staging.finflow.local"
    - "prod.finflow.local"
  paths:
    - backendService: "otelcol-gateway-opentelemetry-collector"

  argocdIngress:
    enabled: true
    className: "traefik"
    host: "argocd.finflow.local"
