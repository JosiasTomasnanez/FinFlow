argo-rollouts:
  installCRDs: false
networkPolicy:
  enabled: true
environment: "prod"
backend:
  replicas: 3
  port: 8080
  image:
    repository: harbor.finflow.local/finflow/finflow-backend
    tag: f3d6dcbc3a7ac734c91c25a8b4234664c9240e89
  databaseHost: "finflow-prod-postgres-service"
  databasePort: "5432"
  redisUrl: "redis://finflow-prod-redis-service:6339/0"
  unleashUrl: "http://unleash-web.finflow-infra.svc.cluster.local:4242/api"
  otelExporterOtlpEndpoint: "otelcol-gateway-opentelemetry-collector.finflow-infra.svc.cluster.local:4318"
  argoStrategy:
    steps:
      - setWeight: 33
      - pause: {}
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    minReplicas: 1
    maxReplicas: 10
    cooldownPeriod: 180
    threshold: 25
database:
  enabled: true
  storageSize: 5Gi
frontend:
  replicas: 3
  image:
    repository: harbor.finflow.local/finflow/finflow-frontend
    tag: f3d6dcbc3a7ac734c91c25a8b4234664c9240e89
  apiUrl: "http://prod.finflow.local/api"
  otelUrl: "http://prod.finflow.local"
  argoStrategy:
    steps:
      - setWeight: 33
      - pause: {}
ingress:
  enabled: true
  className: "traefik"
  host: "prod.finflow.local"
